<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body { font-family: -apple-system, sans-serif; width: 240px; padding: 12px; }
      h1 { font-size: 14px; margin: 0 0 8px; }
      label { font-size: 12px; display: block; margin: 6px 0 2px; }
      select, button { width: 100%; padding: 6px; font-size: 13px; }
      button { margin-top: 10px; background: #111; color: #fff; border: 0; border-radius: 4px; cursor: pointer; }
      button:hover { background: #333; }
      .status { font-size: 11px; color: #666; margin-top: 8px; min-height: 14px; }
    </style>
  </head>
  <body>
    <h1>LLM Translate</h1>
    <label for="target">翻訳先</label>
    <select id="target">
      <option value="ja">日本語</option>
      <option value="en">English</option>
      <option value="zh">中文</option>
      <option value="ko">한국어</option>
    </select>
    <label for="model" style="margin-top:8px;">モデル</label>
    <select id="model">
      <option value="haiku">Haiku (速い / 安い)</option>
      <option value="sonnet" selected>Sonnet 4.5 (推奨)</option>
      <option value="opus">Opus (最高品質 / 遅い)</option>
    </select>
    <button id="go">このページを翻訳</button>
    <button id="restore" style="background:#666;">原文に戻す</button>
    <button id="diag" style="background:#444; margin-top:6px;">診断</button>
    <div class="status" id="status"></div>
    <pre id="diagOut" style="font-size:10px; max-height:220px; overflow:auto; background:#111; color:#0f0; padding:6px; margin-top:8px; display:none; white-space:pre-wrap;"></pre>
    <script src="popup.js"></script>
  </body>
</html>
