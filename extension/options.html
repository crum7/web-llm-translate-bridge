<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>LLM Translate 設定</title>
    <style>
      body { font-family: -apple-system, sans-serif; max-width: 500px; margin: 24px auto; padding: 0 16px; }
      h1 { font-size: 18px; }
      label { display: block; margin-top: 12px; font-size: 13px; }
      input { width: 100%; padding: 6px; font-size: 13px; box-sizing: border-box; }
      button { margin-top: 16px; padding: 8px 16px; background: #111; color: #fff; border: 0; border-radius: 4px; cursor: pointer; }
      .hint { font-size: 12px; color: #666; margin-top: 4px; }
      .saved { color: green; margin-left: 12px; font-size: 12px; }
    </style>
  </head>
  <body>
    <h1>LLM Translate 設定</h1>
    <label>Bridge URL</label>
    <input id="bridgeUrl" type="text" placeholder="http://127.0.0.1:17891" />
    <div class="hint">bridgeサーバのURL。通常はデフォルトのまま。</div>

    <label>Auth Token</label>
    <input id="token" type="text" placeholder="bridge起動時に表示されるtoken" />
    <div class="hint">
      bridgeを起動すると <code>~/.llm-translate-bridge/token</code> に保存される。
      またはbridge起動ログの token 行をコピペ。
    </div>

    <button id="save">保存</button>
    <span class="saved" id="saved"></span>

    <script src="options.js"></script>
  </body>
</html>
